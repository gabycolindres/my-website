<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wynwood Dog Food Co. — Retail Associate Playbook</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FAFAF7;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Browser-style chrome */
  .chrome { background: #2B2B2B; flex-shrink: 0; }

  .brandbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 20px 11px;
  }
  .paw { font-size: 24px; line-height: 1; }
  .brand-text .logo-text {
    color: #F5C842; font-size: 16px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.1;
  }
  .brand-text .logo-sub {
    color: #9a978f; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.11em; text-transform: uppercase; margin-top: 2px;
  }

  /* Tab strip */
  .tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    padding: 0 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabstrip::-webkit-scrollbar { display: none; }

  .tab {
    padding: 9px 17px 10px;
    border-radius: 9px 9px 0 0;
    background: #3a3a37;
    color: #c9c5bc;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border: none;
    transition: background 0.14s, color 0.14s;
  }
  .tab:hover { background: #474743; color: #efece4; }
  .tab.active {
    background: #FAFAF7;
    color: #1a1a1a;
  }

  .addtab {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: transparent;
    color: #c9c5bc;
    border: 1.5px dashed #575751;
    font-size: 17px; line-height: 1;
    cursor: pointer;
    margin: 0 2px 5px 5px;
    flex-shrink: 0;
    transition: all 0.14s;
  }
  .addtab:hover { color: #F5C842; border-color: #F5C842; }

  /* Add menu */
  .addwrap { position: relative; flex-shrink: 0; }
  .addmenu {
    position: absolute;
    top: 38px; left: 0;
    background: #fff;
    border: 1px solid #e2e0d8;
    border-radius: 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.16);
    padding: 8px;
    width: 230px;
    z-index: 50;
    display: none;
  }
  .addmenu.open { display: block; }
  .addmenu .am-title {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #999; padding: 6px 10px 8px;
  }
  .addmenu .am-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 11px; border-radius: 8px; font-size: 13px; color: #555;
    cursor: default;
  }
  .addmenu .am-item .soon {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #b9946a; background: #FBF2E2;
    padding: 2px 7px; border-radius: 20px;
  }
  .addmenu .am-note {
    font-size: 11.5px; color: #999; line-height: 1.5;
    padding: 8px 11px 4px; border-top: 1px solid #f0eee7; margin-top: 4px;
  }

  /* Content frame */
  .frame-wrap { flex: 1; min-height: 0; background: #FAFAF7; }
  iframe { width: 100%; height: 100%; border: none; display: block; }

  @media (max-width: 560px) {
    .brand-text .logo-sub { display: none; }
    .tab { padding: 8px 13px 9px; font-size: 12.5px; }
  }
</style>
</head>
<body>
  <div class="chrome">
    <div class="brandbar">
      <span class="paw">🐾</span>
      <div class="brand-text">
        <div class="logo-text">Wynwood Dog Food Co.</div>
        <div class="logo-sub">Retail Associate Playbook</div>
      </div>
    </div>
    <div class="tabstrip" id="tabstrip"></div>
  </div>

  <div class="frame-wrap">
    <iframe id="frame" title="Playbook content" src="home.html"></iframe>
  </div>

<script>
  const TABS = [
    { id: "home",     label: "Home",              file: "home.html" },
    { id: "policies", label: "Workplace Policies", file: "policies.html" },
    { id: "refunds",  label: "Refund & Reship",   file: "refunds.html" },
    { id: "diet",     label: "Diet Finder",       file: "diet-finder.html" },
  ];

  const FUTURE = ["Onboarding", "Opening & Closing", "POS & Register", "Feeding Guide"];

  let active = "home";
  const strip = document.getElementById("tabstrip");
  const frame = document.getElementById("frame");

  function render() {
    strip.innerHTML = "";
    TABS.forEach(t => {
      const b = document.createElement("button");
      b.className = "tab" + (t.id === active ? " active" : "");
      b.textContent = t.label;
      b.onclick = () => go(t.id);
      strip.appendChild(b);
    });

    const wrap = document.createElement("div");
    wrap.className = "addwrap";
    const add = document.createElement("button");
    add.className = "addtab";
    add.textContent = "+";
    add.title = "Add a chapter";
    add.onclick = (e) => { e.stopPropagation(); toggleMenu(); };
    wrap.appendChild(add);

    const menu = document.createElement("div");
    menu.className = "addmenu";
    menu.id = "addmenu";
    menu.innerHTML =
      '<div class="am-title">Add a chapter</div>' +
      FUTURE.map(f => '<div class="am-item">' + f + '<span class="soon">Soon</span></div>').join("") +
      '<div class="am-note">More chapters can be dropped in as their own file — the playbook grows with the store.</div>';
    wrap.appendChild(menu);
    strip.appendChild(wrap);
  }

  function go(id) {
    const t = TABS.find(x => x.id === id);
    if (!t) return;
    active = id;
    frame.src = t.file;
    closeMenu();
    render();
  }
  window.go = go;

  function toggleMenu() {
    const m = document.getElementById("addmenu");
    m.classList.toggle("open");
  }
  function closeMenu() {
    const m = document.getElementById("addmenu");
    if (m) m.classList.remove("open");
  }
  document.addEventListener("click", closeMenu);

  render();
</script>
</body>
</html>
